name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt "SQLAlchemy>=2.0,<3.0"
      - run: python -m compileall -q app.py src scripts tests
      - run: python -m unittest discover -s tests -v
